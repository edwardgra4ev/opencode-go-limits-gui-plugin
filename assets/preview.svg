<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" width="1120" height="400" role="img" aria-labelledby="title desc">
  <title id="title">OpenCode Go Limits — animated preview</title>
  <desc id="desc">OpenCode Desktop window with a bottom strip showing three circular meters for the OpenCode Go allowance: 5h, Week and Month, each with a percentage and a reset countdown. The meters grow, turn yellow at 80% and red at 100%, then reset.</desc>

  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171a20"/>
      <stop offset="1" stop-color="#121519"/>
    </linearGradient>
    <clipPath id="winClip">
      <rect x="16" y="16" width="1088" height="330" rx="14"/>
    </clipPath>
    <style>
      text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .t     { font-size: 12px; fill: #aeb4bd; }
      .dim   { fill: #2a303a; }
      .dim2  { fill: #343b46; }
      .mono  { font-size: 11px; }
    </style>
  </defs>

  <!-- window -->
  <rect x="16" y="16" width="1088" height="330" rx="14" fill="url(#win)" stroke="#2b313a"/>

  <g clip-path="url(#winClip)">
    <!-- title bar -->
    <rect x="16" y="16" width="1088" height="46" fill="#191d23"/>
    <circle cx="44" cy="39" r="4.5" fill="#3a404a"/>
    <circle cx="60" cy="39" r="4.5" fill="#3a404a"/>
    <circle cx="76" cy="39" r="4.5" fill="#3a404a"/>
    <text class="t" x="100" y="43" fill="#8d949e">~/dev/api</text>
    <text class="t" x="1092" y="43" text-anchor="end" fill="#5d646e">⌘K</text>
    <line x1="16" y1="62" x2="1104" y2="62" stroke="#242a33"/>

    <!-- dimmed chat behind the strip -->
    <g opacity="0.55">
      <rect x="60" y="88" width="620" height="8" rx="4" class="dim"/>
      <rect x="60" y="106" width="560" height="8" rx="4" class="dim"/>
      <rect x="60" y="124" width="470" height="8" rx="4" class="dim"/>
      <rect x="60" y="142" width="300" height="8" rx="4" class="dim"/>

      <rect x="752" y="164" width="308" height="46" rx="10" fill="#232a34"/>
      <rect x="768" y="180" width="250" height="7" rx="3.5" class="dim2"/>
      <rect x="768" y="193" width="180" height="7" rx="3.5" class="dim2"/>

      <rect x="60" y="232" width="520" height="62" rx="8" fill="#0f1217" stroke="#232830"/>
      <rect x="76" y="248" width="42" height="6" rx="3" fill="#3f6b4a"/>
      <rect x="126" y="248" width="190" height="6" rx="3" fill="#333a45"/>
      <rect x="76" y="264" width="60" height="6" rx="3" fill="#3b5570"/>
      <rect x="144" y="264" width="240" height="6" rx="3" fill="#333a45"/>
      <rect x="76" y="280" width="34" height="6" rx="3" fill="#5b4a6b"/>
      <rect x="118" y="280" width="150" height="6" rx="3" fill="#333a45"/>

      <rect x="752" y="232" width="308" height="8" rx="4" class="dim"/>
      <rect x="752" y="250" width="240" height="8" rx="4" class="dim"/>
    </g>

    <!-- bottom strip -->
    <line x1="16" y1="310" x2="1104" y2="310" stroke="#ffffff" stroke-opacity="0.06"/>
    <rect x="16" y="310" width="1088" height="36" fill="#101317"/>

    <!-- loading state -->
    <g opacity="0">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite"
               values="0.2;1;0.2;1;0;0" keyTimes="0;0.02;0.04;0.06;0.10;1"/>
      <text x="1092" y="333" text-anchor="end" class="mono" fill="#6f7680">Go limits…</text>
    </g>

    <!-- loaded strip: brand + three meters -->
    <g opacity="0">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="linear"
               values="0;0;1;1;0" keyTimes="0;0.10;0.143;0.94;1"/>

      <text x="515" y="333" class="mono" font-weight="600" fill="#d8dce2">Go</text>

      <!-- 5h -->
      <g transform="translate(539,0)">
        <circle cx="9" cy="328" r="7" fill="none" stroke="#3a404a" stroke-width="2.5"/>
        <circle cx="9" cy="328" r="7" fill="none" stroke-width="2.5" stroke-linecap="round"
                transform="rotate(-90 9 328)" stroke-dasharray="0 44" stroke="#8a8f98">
          <animate attributeName="stroke-dasharray" dur="14s" repeatCount="indefinite" calcMode="linear"
                   values="0 44;0 44;5.278 44;20.672 44;36.066 44;43.982 44;43.982 44;1.319 44;7.917 44;7.917 44"
                   keyTimes="0;0.10;0.143;0.30;0.536;0.643;0.714;0.715;0.857;1"/>
          <animate attributeName="stroke" dur="14s" repeatCount="indefinite" calcMode="discrete"
                   values="#8a8f98;#d9a400;#e5484d;#8a8f98" keyTimes="0;0.536;0.643;0.715"/>
        </circle>
        <text x="25" y="332" class="mono" fill="#c9ced6">5h</text>

        <g class="mono" text-anchor="end">
          <text x="86" y="332" fill="#8a8f98" opacity="0">12%
            <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete"
                     values="0;1;0;0" keyTimes="0;0.143;0.30;1"/>
          </text>
          <text x="86" y="332" fill="#8a8f98" opacity="0">47%
            <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete"
                     values="0;1;0;0" keyTimes="0;0.30;0.536;1"/>
          </text>
          <text x="86" y="332" fill="#d9a400" opacity="0">82%
            <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete"
                     values="0;1;0;0" keyTimes="0;0.536;0.643;1"/>
          </text>
          <text x="86" y="332" fill="#e5484d" opacity="0">100%
            <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete"
                     values="0;1;0;0" keyTimes="0;0.643;0.714;1"/>
          </text>
          <text x="86" y="332" fill="#8a8f98" opacity="0">3%
            <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete"
                     values="0;1;0;0" keyTimes="0;0.714;0.857;1"/>
          </text>
          <text x="86" y="332" fill="#8a8f98" opacity="0">18%
            <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete"
                     values="0;1" keyTimes="0;0.857"/>
          </text>
        </g>

        <g class="mono" fill="#6f7680">
          <text x="94" y="332" opacity="0">resets in 2h 18m
            <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete"
                     values="0;1;0;0" keyTimes="0;0.143;0.36;1"/>
          </text>
          <text x="94" y="332" opacity="0">resets in 2h 9m
            <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete"
                     values="0;1;0;0" keyTimes="0;0.36;0.536;1"/>
          </text>
          <text x="94" y="332" opacity="0">resets in 2h 3m
            <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete"
                     values="0;1;0;0" keyTimes="0;0.536;0.643;1"/>
          </text>
          <text x="94" y="332" opacity="0">resets in 59m
            <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete"
                     values="0;1;0;0" keyTimes="0;0.643;0.714;1"/>
          </text>
          <text x="94" y="332" opacity="0">resets in 4h 59m
            <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete"
                     values="0;1" keyTimes="0;0.714"/>
          </text>
        </g>
      </g>

      <!-- Week -->
      <g transform="translate(727,0)">
        <circle cx="9" cy="328" r="7" fill="none" stroke="#3a404a" stroke-width="2.5"/>
        <circle cx="9" cy="328" r="7" fill="none" stroke-width="2.5" stroke-linecap="round"
                transform="rotate(-90 9 328)" stroke-dasharray="0 44" stroke="#8a8f98">
          <animate attributeName="stroke-dasharray" dur="14s" repeatCount="indefinite" calcMode="linear"
                   values="0 44;0 44;28.149 44;31.227 44;37.825 44;37.825 44"
                   keyTimes="0;0.10;0.143;0.30;0.536;1"/>
          <animate attributeName="stroke" dur="14s" repeatCount="indefinite" calcMode="discrete"
                   values="#8a8f98;#d9a400" keyTimes="0;0.536"/>
        </circle>
        <text x="25" y="332" class="mono" fill="#c9ced6">Week</text>

        <g class="mono" text-anchor="end">
          <text x="86" y="332" fill="#8a8f98" opacity="0">64%
            <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete"
                     values="0;1;0;0" keyTimes="0;0.143;0.30;1"/>
          </text>
          <text x="86" y="332" fill="#8a8f98" opacity="0">71%
            <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete"
                     values="0;1;0;0" keyTimes="0;0.30;0.536;1"/>
          </text>
          <text x="86" y="332" fill="#d9a400" opacity="0">86%
            <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete"
                     values="0;1" keyTimes="0;0.536"/>
          </text>
        </g>

        <g class="mono" fill="#6f7680">
          <text x="94" y="332" opacity="0">resets in 2d 6h
            <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete"
                     values="0;1;0;0" keyTimes="0;0.143;0.536;1"/>
          </text>
          <text x="94" y="332" opacity="0">resets in 2d 3h
            <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete"
                     values="0;1" keyTimes="0;0.536"/>
          </text>
        </g>
      </g>

      <!-- Month -->
      <g transform="translate(915,0)">
        <circle cx="9" cy="328" r="7" fill="none" stroke="#3a404a" stroke-width="2.5"/>
        <circle cx="9" cy="328" r="7" fill="none" stroke-width="2.5" stroke-linecap="round"
                transform="rotate(-90 9 328)" stroke-dasharray="0 44" stroke="#8a8f98">
          <animate attributeName="stroke-dasharray" dur="14s" repeatCount="indefinite" calcMode="linear"
                   values="0 44;0 44;16.713 44;17.153 44;18.033 44;18.033 44"
                   keyTimes="0;0.10;0.143;0.30;0.536;1"/>
        </circle>
        <text x="25" y="332" class="mono" fill="#c9ced6">Month</text>

        <g class="mono" text-anchor="end" fill="#8a8f98">
          <text x="86" y="332" opacity="0">38%
            <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete"
                     values="0;1;0;0" keyTimes="0;0.143;0.30;1"/>
          </text>
          <text x="86" y="332" opacity="0">39%
            <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete"
                     values="0;1;0;0" keyTimes="0;0.30;0.536;1"/>
          </text>
          <text x="86" y="332" opacity="0">41%
            <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete"
                     values="0;1" keyTimes="0;0.536"/>
          </text>
        </g>

        <text x="94" y="332" class="mono" fill="#6f7680">resets in 12d 4h</text>
      </g>
    </g>
  </g>

  <!-- captions -->
  <g text-anchor="middle" class="t" fill="#8b929c" opacity="0.95">
    <text x="560" y="380" opacity="0">Your OpenCode Go allowance lives in the bottom strip
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete"
               values="0;1;0;0" keyTimes="0;0.02;0.17;1"/>
    </text>
    <text x="560" y="380" opacity="0">Ring, percent and time until reset — refreshed every 60 s
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete"
               values="0;1;0;0" keyTimes="0;0.17;0.36;1"/>
    </text>
    <text x="560" y="380" opacity="0">80% and above turns yellow, 100% turns red
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete"
               values="0;1;0;0" keyTimes="0;0.36;0.72;1"/>
    </text>
    <text x="560" y="380" opacity="0">When the 5-hour window resets, the meters start over
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete"
               values="0;1" keyTimes="0;0.72"/>
    </text>
  </g>
</svg>
